<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Batch-convert images to AVIF, WebP, JPEG XL, JPEG and PNG — entirely in your browser." />
    <title>Image Converter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffe14d' stroke='black' stroke-width='3'/%3E%3Cpath d='M8 22l5-6 4 4 3-3 4 5z' fill='black'/%3E%3Ccircle cx='21' cy='11' r='2.5' fill='black'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="1.5" y="1.5" width="29" height="29" fill="var(--accent)" stroke="var(--ink)" stroke-width="3"/><path d="M7 23l6-7 4 4 3-3 5 6z" fill="#000"/><rect x="19" y="8" width="5" height="5" fill="#000"/></svg>
        </span>
        <div>
          <h1>Image Converter</h1>
          <p class="tagline">AVIF · WebP · JPEG XL · JPEG · PNG</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel settings" aria-label="Conversion settings">
        <section>
          <h2>Output format</h2>
          <div class="formats" id="formats" role="radiogroup" aria-label="Output format"></div>
        </section>

        <section id="quality-section">
          <div class="row-between">
            <h2><label for="quality">Quality</label></h2>
            <output id="quality-value" class="pill">80</output>
          </div>
          <input type="range" id="quality" min="1" max="100" step="1" value="80" />
          <div class="scale"><span>Smaller</span><span>Better</span></div>
        </section>

        <section id="lossless-section">
          <label class="switch">
            <input type="checkbox" id="lossless" />
            <span class="track"><span class="thumb"></span></span>
            <span>Lossless</span>
          </label>
        </section>

        <section>
          <h2>Encoder effort</h2>
          <div class="segmented" id="effort" role="radiogroup" aria-label="Encoder effort">
            <button type="button" data-value="fast" role="radio">Fastest</button>
            <button type="button" data-value="balanced" role="radio">Balanced</button>
            <button type="button" data-value="small" role="radio">Smallest</button>
          </div>
        </section>

        <section>
          <h2>Resize <span class="muted">(optional, keeps aspect ratio)</span></h2>
          <div class="resize">
            <label><span>Max width</span><input type="number" id="max-width" min="0" step="1" placeholder="Original" inputmode="numeric" /></label>
            <span class="times" aria-hidden="true">×</span>
            <label><span>Max height</span><input type="number" id="max-height" min="0" step="1" placeholder="Original" inputmode="numeric" /></label>
          </div>
        </section>

        <section>
          <label class="switch">
            <input type="checkbox" id="autostart" checked />
            <span class="track"><span class="thumb"></span></span>
            <span>Convert automatically when files are added</span>
          </label>
        </section>

        <p class="footnote" id="engine-info"></p>
      </aside>

      <section class="workspace">
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Add images">
          <input type="file" id="file-input" multiple accept="image/*,.jxl,.avif,.heic,.heif" hidden />
          <svg viewBox="0 0 24 24" aria-hidden="true" class="drop-icon"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <strong>Drop images or folders here</strong>
          <span class="muted">or <u>browse files</u> · <button type="button" class="linklike" id="pick-folder">pick a folder</button> · paste with <kbd>⌘/Ctrl V</kbd></span>
        </div>
        <input type="file" id="folder-input" webkitdirectory multiple hidden />

        <div class="toolbar" id="toolbar" hidden>
          <div class="summary">
            <div class="summary-line"><strong id="sum-count"></strong><span id="sum-sizes" class="muted"></span></div>
            <div class="progress" aria-hidden="true"><div class="bar" id="progress-bar"></div></div>
          </div>
          <div class="actions">
            <button type="button" class="btn primary" id="convert-btn">Convert</button>
            <button type="button" class="btn" id="cancel-btn" hidden>Cancel</button>
            <button type="button" class="btn" id="zip-btn" disabled>Download ZIP</button>
            <button type="button" class="btn" id="folder-btn" disabled hidden>Save to folder</button>
            <button type="button" class="btn ghost" id="clear-btn">Clear</button>
          </div>
        </div>

        <ul class="files" id="file-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="row-template">
      <li class="file">
        <div class="thumb"><img alt="" loading="lazy" decoding="async" /><span class="ext"></span></div>
        <div class="meta">
          <div class="name"></div>
          <div class="details muted"></div>
        </div>
        <div class="result"></div>
        <div class="row-actions">
          <button type="button" class="icon-btn download" title="Download" aria-label="Download" hidden>
            <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="icon-btn remove" title="Remove" aria-label="Remove">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </li>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
